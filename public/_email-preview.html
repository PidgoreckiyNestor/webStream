<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <title>You're on the MindVault Lab beta list</title>
  <style>
    :root { color-scheme: light only; supported-color-schemes: light only; }
    body { margin: 0; padding: 0; width: 100% !important; background: #e8eaed; font-family: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .canvas { background-color: #e8eaed !important; background-image: linear-gradient(#e8eaed, #e8eaed); }
    .card { background-color: #ffffff !important; background-image: linear-gradient(#ffffff, #ffffff); }
    .ink { color: #111111 !important; }
    .muted { color: #6b7280 !important; }
    @media (prefers-color-scheme: dark) {
      body, .canvas { background-color: #e8eaed !important; background-image: linear-gradient(#e8eaed, #e8eaed) !important; }
      .card { background-color: #ffffff !important; background-image: linear-gradient(#ffffff, #ffffff) !important; }
      .ink { color: #111111 !important; }
      .muted { color: #6b7280 !important; }
    }
  </style>
</head>
<body class="canvas" style="margin:0;padding:0;background-color:#e8eaed;background-image:linear-gradient(#e8eaed,#e8eaed);">
  <table role="presentation" class="canvas" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#e8eaed" style="background-color:#e8eaed;background-image:linear-gradient(#e8eaed,#e8eaed);">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
          <tr>
            <td class="card" bgcolor="#ffffff" style="background-color:#ffffff;background-image:linear-gradient(#ffffff,#ffffff);border-radius:16px;overflow:hidden;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#06070a" align="center" style="background-color:#06070a;background-image:linear-gradient(#06070a,#06070a);padding:0;font-size:0;line-height:0;">
                    <img src="/images/logo-mindvault-email.png" alt="MindVault" width="560" height="70" style="display:block;width:100%;max-width:560px;height:auto;border:0;" />
                  </td>
                </tr>
                <tr>
                  <td class="card" style="padding:36px 36px 40px;background-color:#ffffff;background-image:linear-gradient(#ffffff,#ffffff);">
                    <p class="ink" style="margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-0.03em;color:#111111;">
                      You're on the Lab beta list
                    </p>
                    <p class="muted" style="margin:20px 0 0;font-size:16px;line-height:1.65;color:#6b7280;">
                      LSL, OSC, API, and markers on the desk.
                    </p>
                    <p class="muted" style="margin:20px 0 0;font-size:16px;line-height:1.65;color:#6b7280;">
                      We'll write when it opens.
                    </p>
                    <p class="ink" style="margin:28px 0 0;font-size:15px;line-height:1.5;color:#111111;">
                      — MindVault
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="muted" align="center" style="padding:20px 8px 0;font-size:12px;line-height:1.5;color:#6b7280;">
              One note. Not a newsletter.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
